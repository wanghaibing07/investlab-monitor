name: Prepare Vercel static demo
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Generate and validate public synthetic site
        run: |
          python scripts/build_vercel_demo.py
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          from tempfile import gettempdir
          import os

          dist = Path("dist")
          expected = {"index.html", "app.js", "style.css", "data/latest.json",
                      "data/research.json", "data/history.json", "data/journal.json"}
          actual = {str(x.relative_to(dist)) for x in dist.rglob("*") if x.is_file()}
          assert actual == expected, (actual, expected)
          report = json.loads((dist / "data/latest.json").read_text())
          research = json.loads((dist / "data/research.json").read_text())
          assert report.get("demo") is True
          assert report["operation"]["status"] == "SUCCEEDED"
          assert research.get("status") == "PASS"
          assert json.loads((dist / "data/journal.json").read_text()) == []
          cfg = json.loads(Path("vercel.json").read_text())
          cfg["buildCommand"] = ""
          cfg["outputDirectory"] = "."
          (dist / "vercel.json").write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n")
          result = Path(os.environ["RUNNER_TEMP"]) / "investlab-vercel-site"
          if result.exists():
              shutil.rmtree(result)
          shutil.copytree(dist, result)
          assert {str(x.relative_to(result)) for x in result.rglob("*") if x.is_file()} == (expected | {"vercel.json"})
          print("PUBLIC_SITE_CONTENTS_VALIDATED", len(expected)+1)
          PY
      - name: Publish immutable synthetic-only build branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan vercel-site
          git rm -rf -q .
          git clean -fdx -q
          cp -R "$RUNNER_TEMP/investlab-vercel-site/." .
          git add -A
          git commit -m "Publish InvestLab synthetic dashboard from verified source ${{ github.event.workflow_run.head_sha }}"
          git push --force origin HEAD:refs/heads/vercel-site
