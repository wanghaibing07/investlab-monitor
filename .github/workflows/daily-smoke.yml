name: Private daily operations quick check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduled-flow-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest tests.app.test_daily_operations -v
      - name: Check systemd has monitored wrapper
        run: |
          grep -q 'run-daily.sh' deploy/investlab.service
          grep -q 'daily-cycle' deploy/run-daily.sh
          grep -q 'notify-pending' deploy/run-daily.sh
