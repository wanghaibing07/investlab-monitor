name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests/legacy -q
        env:
          PYTHONPATH: src/investlab/engine
      - run: python -m unittest discover -s tests/app -q
      - run: python scripts/check_release.py
      - run: investlab --home /tmp/investlab-demo init --demo
      - run: investlab --home /tmp/investlab-demo run
      - run: investlab --home /tmp/investlab-demo verify
      - run: investlab --home /tmp/investlab-demo audit
      - name: Check actual public demo HTTP endpoints
        env:
          INVESTLAB_PUBLIC_HOSTNAME: investlab.example.test
        run: |
          investlab --home /tmp/investlab-demo serve --public-demo --port 8765 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python - <<'PY'
          import http.client
          import json
          import time

          def request(method, path, host="investlab.example.test"):
              conn = http.client.HTTPConnection("127.0.0.1", 8765, timeout=5)
              conn.request(method, path, headers={"Host": host})
              response = conn.getresponse()
              status, body = response.status, response.read()
              conn.close()
              return status, body

          for attempt in range(50):
              try:
                  status, body = request("GET", "/health/live")
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise AssertionError("public demo HTTP server did not start")
          assert status == 200, status
          assert json.loads(body)["status"] == "UP"
          status, body = request("GET", "/health/ready")
          assert status == 200 and json.loads(body)["status"] == "READY"
          status, body = request("GET", "/api/latest")
          assert status == 200 and json.loads(body)["demo"] is True
          for route in ("/", "/app.js", "/style.css", "/api/research", "/api/history", "/api/journal"):
              status, body = request("GET", route)
              assert status == 200 and body, (route, status)
          assert request("GET", "/api/latest", "untrusted.example.test")[0] == 403
          assert request("POST", "/api/latest")[0] == 405
          PY

      - run: python -m pip wheel --no-deps . -w /tmp/wheels
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build container
        run: docker build -f deploy/Dockerfile -t investlab-ci .
      - name: Exercise durable demo state across containers
        run: |
          docker volume create investlab-ci-data
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -v investlab-ci-data:/var/lib/investlab investlab-ci init --demo
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -v investlab-ci-data:/var/lib/investlab investlab-ci run
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -v investlab-ci-data:/var/lib/investlab investlab-ci verify
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -v investlab-ci-data:/var/lib/investlab investlab-ci audit
