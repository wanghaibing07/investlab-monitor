name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests/legacy -q
        env:
          PYTHONPATH: src/investlab/engine
      - run: python -m unittest discover -s tests/app -q
      - run: python scripts/check_release.py
      - run: investlab --home /tmp/investlab-demo init --demo
      - run: investlab --home /tmp/investlab-demo run
      - run: investlab --home /tmp/investlab-demo verify
      - run: investlab --home /tmp/investlab-demo audit
      - run: python -m pip wheel --no-deps . -w /tmp/wheels
