name: Verify Vercel private cloud runtime
on:
  push:
    paths:
      - 'deploy/cloud/**'
      - 'src/investlab/cloud.py'
      - 'tests/app/test_cloud_runtime.py'
      - '.github/workflows/cloud-verify.yml'
  pull_request:
    paths:
      - 'deploy/cloud/**'
      - 'src/investlab/cloud.py'
      - 'tests/app/test_cloud_runtime.py'
      - '.github/workflows/cloud-verify.yml'
permissions:
  contents: read
jobs:
  cloud-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify cloud runtime installs
        run: python -m pip install -r deploy/cloud/requirements.txt
      - name: Check cloud safety, storage and health
        run: python -m unittest discover -s tests/app -p test_cloud_runtime.py -v
      - name: Verify protected cloud HTTP boundary
        run: python -m unittest discover -s tests/cloud -v
      - name: Import FastAPI entrypoint
        run: |
          python - <<'PY'
          import importlib.util
          s=importlib.util.spec_from_file_location("investlab_cloud_app","deploy/cloud/app.py")
          m=importlib.util.module_from_spec(s)
          s.loader.exec_module(m)
          names={route.path for route in m.app.routes}
          assert {"/health","/api/status","/api/latest","/api/initialize","/api/cron/daily"} <= names
          assert m.app.docs_url is None
          print("PRIVATE_CLOUD_ROUTES_OK")
          PY
