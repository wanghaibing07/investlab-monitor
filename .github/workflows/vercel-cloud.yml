name: Prepare private Vercel Python cloud runtime
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  package-cloud:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/cloud/requirements.txt
      - name: Run private cloud tests
        run: |
          python -m unittest discover -s tests/app -p test_cloud_runtime.py -v
          python -m unittest discover -s tests/cloud -v
          python - <<'PY'
          from pathlib import Path
          import json
          cfg=json.loads(Path("deploy/cloud/vercel.json").read_text())
          assert cfg["framework"]=="fastapi"
          assert "crons" not in cfg, "Do not activate cron until account + auth are tested"
          from investlab import cloud
          assert cloud.MAX_ARCHIVE_BYTES<=30*1024*1024
          print("PRIVATE_CLOUD_PACKAGE_GATE_PASS")
          PY
      - name: Stage only runtime code (no accounts or environment files)
        run: |
          set -eu
          dest="$RUNNER_TEMP/investlab-cloud-site"
          mkdir -p "$dest"
          cp -R src "$dest/"
          cp pyproject.toml README.md "$dest/"
          cp deploy/cloud/app.py "$dest/app.py"
          cp deploy/cloud/vercel.json "$dest/vercel.json"
          cp deploy/cloud/requirements.txt "$dest/requirements.txt"
          CLOUD_OUT="$dest" python - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ["CLOUD_OUT"])
          files=[p for p in root.rglob("*") if p.is_file()]
          allowed={"app.py","vercel.json","requirements.txt","pyproject.toml","README.md"}
          assert all((p.relative_to(root).as_posix() in allowed or
               p.relative_to(root).as_posix().startswith("src/")) for p in files)
          assert all(not any(x in p.parts for x in
               (".git","data","backups",".venv","__pycache__")) for p in files)
          for p in files:
              if p.suffix in (".env",".sqlite3",".db",".zip",".pem",".key"):
                  raise RuntimeError("Private data extension entered cloud build")
          print("PRIVATE_ONLY_CODE_FILES",len(files))
          PY
      - name: Publish inspected immutable build branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan vercel-cloud
          git rm -rf -q . || true
          git clean -fdx -q
          cp -R "$RUNNER_TEMP/investlab-cloud-site/." .
          git add -A
          git commit -m "Publish Vercel private Python cloud runtime from reviewed source ${{ github.event.workflow_run.head_sha }}"
          git push --force origin HEAD:refs/heads/vercel-cloud
