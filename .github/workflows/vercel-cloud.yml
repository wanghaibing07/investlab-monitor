name: Prepare private Vercel Python cloud runtime
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  package-cloud:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/cloud/requirements.txt
      - name: Run private cloud tests
        run: |
          python -m unittest discover -s tests/app -p test_cloud_runtime.py -v
          python -m unittest discover -s tests/cloud -v
          python - <<'PY'
          from pathlib import Path
          import json
          cfg=json.loads(Path("deploy/cloud/vercel.json").read_text())
          assert cfg["framework"]=="fastapi"
          assert "crons" not in cfg, "Do not activate cron until account + auth are tested"
          from investlab import cloud
          assert cloud.MAX_ARCHIVE_BYTES<=30*1024*1024
          print("PRIVATE_CLOUD_PACKAGE_GATE_PASS")
          PY
      - name: Stage only runtime code (no accounts or environment files)
        run: |
          set -eu
          dest="$RUNNER_TEMP/investlab-cloud-site"
          mkdir -p "$dest"
          mkdir -p "$dest/src"
          rsync -a --exclude='__pycache__' --exclude='*.pyc' --exclude='*.sqlite3' --exclude='*.db' --exclude='*.zip' --exclude='*.pem' --exclude='*.key' src/ "$dest/src/"
          cp pyproject.toml README.md "$dest/"
          cp deploy/cloud/app.py "$dest/app.py"
          cp deploy/cloud/vercel.json "$dest/vercel.json"
          cp deploy/cloud/requirements.txt "$dest/requirements.txt"
          cp -R deploy/cloud/assets "$dest/assets"
          # Assets contain UI code only; all account values load at request time.
          node --check "$dest/assets/app.js"
          test -s "$dest/assets/index.html"
          test -s "$dest/assets/app.css"
          test -s "$dest/assets/decision.css"
          test -s "$dest/assets/app.js"

          # The Vercel Python builder prioritizes root pyproject.toml; it must
          # explicitly include cloud-only packages, not just requirements.txt.
          CLOUD_OUT="$dest" python - <<'PY'
          from pathlib import Path
          import os, tomllib
          root=Path(os.environ["CLOUD_OUT"])
          pyproject=root/"pyproject.toml"
          text=pyproject.read_text(encoding="utf-8")
          needle="dependencies = []"
          assert text.count(needle)==1, "Cannot safely modify cloud dependency manifest"
          text=text.replace(needle,
              'dependencies = ["fastapi>=0.117.1,<1", "vercel==0.12.0"]',1)
          pyproject.write_text(text, encoding="utf-8")
          data=tomllib.loads(text)
          deps=data["project"]["dependencies"]
          assert any(x.startswith("fastapi>=") for x in deps)
          assert "vercel==0.12.0" in deps
          print("VERCEL_CLOUD_PYPROJECT_DEPS_PRESENT")
          PY
          CLOUD_OUT="$dest" python - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ["CLOUD_OUT"])
          files=[p for p in root.rglob("*") if p.is_file()]
          allowed={"app.py","vercel.json","requirements.txt","pyproject.toml","README.md"}
          assert all((p.relative_to(root).as_posix() in allowed or
               p.relative_to(root).as_posix().startswith("src/") or
               p.relative_to(root).as_posix().startswith("assets/")) for p in files)
          assert all(not any(x in p.parts for x in
               (".git","backups",".venv","__pycache__")) for p in files)
          for p in files:
              rel=p.relative_to(root).as_posix()
              if "data" in p.relative_to(root).parts:
                  assert rel=="src/investlab/engine/data/research/protocol_lock.json", rel
          for p in files:
              if p.suffix in (".env",".sqlite3",".db",".zip",".pem",".key"):
                  raise RuntimeError("Private data extension entered cloud build")
          assert {"index.html","app.css","app.js","decision.css"} == {
              p.name for p in (root/"assets").iterdir() if p.is_file()
          }, "Cloud UI asset set differs from reviewed source"
          for name in ("index.html","app.css","app.js","decision.css"):
              raw=(root/"assets"/name).read_text(encoding="utf-8")
              assert raw and len(raw)<200000, name
              assert "BLOB_READ_WRITE_TOKEN" not in raw, name
          print("VERCEL_CLOUD_WEB_ASSETS_AUDITED")
          print("PRIVATE_ONLY_CODE_FILES",len(files))
          PY
      - name: Test the exact staged manifest in a clean Python environment
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/investlab-cloud-env"
          "$RUNNER_TEMP/investlab-cloud-env/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/investlab-cloud-site"
          "$RUNNER_TEMP/investlab-cloud-env/bin/python" - <<'PY'
          from fastapi import FastAPI
          from vercel.blob import put_blob, stream_blob, query_blobs
          from investlab import cloud
          assert FastAPI and put_blob and stream_blob and query_blobs
          print("CLOUD_STAGED_DEPS_IMPORT_PASS")
          PY
      - name: Publish inspected immutable build branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan vercel-cloud
          git rm -rf -q . || true
          git clean -fdx -q
          cp -R "$RUNNER_TEMP/investlab-cloud-site/." .
          git add -A
          git commit -m "Publish Vercel private Python cloud runtime from reviewed source ${{ github.event.workflow_run.head_sha }}"
          git push --force origin HEAD:refs/heads/vercel-cloud
